name: CI Aksesin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validasi dokumen dan aset GitHub Page
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Pastikan berkas wajib tersedia
        run: |
          status=0
          for f in README.md docs/index.md docs/_config.yml; do
            if [ ! -f "$f" ]; then
              echo "Berkas wajib tidak ditemukan: $f"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "Seluruh berkas wajib tersedia."
          fi
          exit $status

      - name: Periksa tautan gambar lokal pada docs
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          rusak = []
          for md in pathlib.Path("docs").rglob("*.md"):
              isi = md.read_text(encoding="utf-8")
              for target in re.findall(r"!\[[^\]]*\]\(([^)]+)\)", isi):
                  if target.startswith(("http://", "https://", "/", "#")):
                      continue
                  if not (md.parent / target).is_file():
                      rusak.append(f"{md}: {target}")

          if rusak:
              print("Aset gambar berikut dirujuk tetapi tidak ditemukan:")
              for baris in rusak:
                  print(" -", baris)
              sys.exit(1)

          print("Seluruh tautan gambar lokal pada docs valid.")
          PY

  build-frontend:
    name: Lint dan build frontend Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Periksa keberadaan proyek frontend
        id: cek
        run: |
          if [ -f web/package.json ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "Folder web belum dibuat. Job dilewati sampai pengembangan frontend dimulai."
          fi

      - name: Siapkan Node.js
        if: steps.cek.outputs.ada == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pasang dependensi
        if: steps.cek.outputs.ada == 'true'
        working-directory: web
        run: npm ci

      - name: Jalankan lint
        if: steps.cek.outputs.ada == 'true'
        working-directory: web
        run: npm run lint --if-present

      - name: Jalankan lint
        if: steps.cek.outputs.ada == 'true'
        working-directory: web
        run: npm run lint --if-present

      - name: Jalankan pengujian
        if: steps.cek.outputs.ada == 'true'
        working-directory: web
        run: npm test

      - name: Jalankan build
        if: steps.cek.outputs.ada == 'true'
        working-directory: web
        run: npm run build

  check-ai-service:
    name: Lint dan uji layanan deteksi AI
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Periksa keberadaan layanan AI
        id: cek
        run: |
          if [ -f ai-service/requirements.txt ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "Folder ai-service belum dibuat. Job dilewati sampai pengembangan layanan AI dimulai."
          fi

      - name: Siapkan Python
        if: steps.cek.outputs.ada == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Pasang dependensi
        if: steps.cek.outputs.ada == 'true'
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Jalankan lint
        if: steps.cek.outputs.ada == 'true'
        working-directory: ai-service
        run: ruff check .

      - name: Jalankan pengujian
        if: steps.cek.outputs.ada == 'true'
        working-directory: ai-service
        run: pytest -q
